---
services:
  plex:
    # Media server: streams your library to apps and devices, with optional hardware transcoding
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PLEX_UID}
      - PGID=${MEDIACENTER_GID}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${ROOT_DIR}/config/plex-config:/config
      - ${ROOT_DIR}/data/media:/media
      # Debrid mount for Real-Debrid content. Uncomment if compose/debrid.yml (decypharr) is included.
      # - ${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:rshared
    restart: unless-stopped

  jellyfin:
    # Free, open-source media server (Plex alternative)
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=002
      - TZ=${TIMEZONE}
    volumes:
      - ${ROOT_DIR}/config/jellyfin-config:/config
      - ${ROOT_DIR}/data/media:/data
      # Debrid mount for Real-Debrid content. Uncomment if compose/debrid.yml (decypharr) is included.
      # - ${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:rshared
    ports:
      - "8096:8096"
    restart: unless-stopped

  feishin:
    # Modern web/desktop music client for Jellyfin, Navidrome or Subsonic libraries
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    environment:
      - SERVER_NAME=jellyfin
      - SERVER_LOCK=true
      - SERVER_TYPE=jellyfin
      - SERVER_URL=jellyfin:8096
    ports:
      - "9180:9180"
    restart: unless-stopped

  romm:
    # ROM library manager: scan, browse and play your retro game collection with metadata and cover art
    image: rommapp/romm:latest
    container_name: romm
    environment:
      - TZ=${TIMEZONE}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
    volumes:
      - ${ROOT_DIR}/config/romm-config:/romm/config
      - ${ROOT_DIR}/config/romm-config/database:/romm/database
      - ${ROOT_DIR}/config/romm-config/resources:/romm/resources
      - ${ROOT_DIR}/config/romm-config/logs:/romm/logs
      - ${ROOT_DIR}/data/media/games:/romm/library
    ports:
      - "8083:8080"
    restart: unless-stopped

  gameyfin:
    # Game library frontend: scan a local games folder and serve a discovery interface with metadata (Romm alternative for PC games)
    image: grimsi/gameyfin:latest
    container_name: gameyfin
    environment:
      - TZ=${TIMEZONE}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/gameyfin/data/gameyfin
      - PUID=${UID}
      - PGID=${MEDIACENTER_GID}
    volumes:
      - ${ROOT_DIR}/config/gameyfin-config:/gameyfin/data
      - ${ROOT_DIR}/data/media/games:/games:ro
    ports:
      - "8084:8080"
    restart: unless-stopped

  drop:
    # Self-hosted game library and store — an open-source alternative to Steam/Epic
    # (browse, manage and play your game collection, with metadata from IGDB/GiantBomb/PCGamingWiki)
    image: ghcr.io/drop-oss/drop:latest
    container_name: drop
    environment:
      - DATABASE_URL=postgres://${DROP_DB_USER:-drop}:${DROP_DB_PASSWORD:-drop}@drop-db:5432/${DROP_DB_NAME:-drop}
      # Public URL where Drop is reachable — change for remote access / reverse proxy
      - EXTERNAL_URL=${DROP_EXTERNAL_URL:-http://localhost:3000}
    volumes:
      - ${ROOT_DIR}/config/drop-config:/data
      - ${ROOT_DIR}/data/media/games:/library
    ports:
      - "3000:3000"
    depends_on:
      drop-db:
        condition: service_healthy
    restart: unless-stopped

  drop-db:
    # PostgreSQL database backing Drop — internal only, not exposed on the host
    image: postgres:14-alpine
    container_name: drop-db
    environment:
      - POSTGRES_USER=${DROP_DB_USER:-drop}
      - POSTGRES_PASSWORD=${DROP_DB_PASSWORD:-drop}
      - POSTGRES_DB=${DROP_DB_NAME:-drop}
    volumes:
      - dropdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DROP_DB_USER:-drop} -d ${DROP_DB_NAME:-drop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dropdb:
