---
services:
  authelia:
    # SSO provider: forward auth for Arr apps, OIDC for Jellyfin and ROMM
    image: authelia/authelia:latest
    container_name: authelia
    environment:
      - TZ=${TIMEZONE}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_SESSION_REDIS_HOST=authelia-redis
    volumes:
      - ${ROOT_DIR}/config/authelia-config:/config
    ports:
      - "9091:9091"
    depends_on:
      authelia-redis:
        condition: service_healthy
    restart: unless-stopped

  authelia-redis:
    # Session store for Authelia
    image: redis:alpine
    container_name: authelia-redis
    command: --save 60 1 --loglevel warning
    volumes:
      - ${ROOT_DIR}/config/authelia-config/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: unless-stopped
