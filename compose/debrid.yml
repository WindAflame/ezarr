---
services:
  decypharr:
    # Debrid gateway: exposes a qBittorrent- and SABnzbd-compatible API to Sonarr/Radarr and mounts
    # your Real-Debrid/AllDebrid/TorBox library as a local filesystem via its embedded rclone/WebDAV.
    # Replaces the previous zurg + rclone + rdtclient stack with a single service.
    # Configure it from the web UI on first run (http://<host>:8282); config is stored in /app.
    image: cy01/blackhole:latest
    container_name: decypharr
    environment:
      - PUID=${UID}
      - PGID=${MEDIACENTER_GID}
      - UMASK=002
      - TZ=${TIMEZONE}
    volumes:
      - ${ROOT_DIR}/config/decypharr-config:/app
      # Debrid mount, shared with Plex/Jellyfin/*arr. Must exist on the host and be bind-mounted rshared.
      - ${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:${DECYPHARR_MOUNT_PATH:-/mnt/debrid}:rshared
      # ezarr data tree, so the qBittorrent/SABnzbd mocks can hand imports to the *arr apps.
      - ${ROOT_DIR}/data:/data
    ports:
      - "8282:8282"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    restart: unless-stopped
